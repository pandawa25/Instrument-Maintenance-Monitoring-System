name: imms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-imms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - imms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imms_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-imms_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-imms_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # HTTP polos di lokal (bukan di belakang HTTPS seperti Railway) — cookie
      # refresh token tidak bisa Secure+SameSite=None di sini, lihat app.config.ts.
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - imms_uploads:/data/uploads

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Container listen di 8080 (lihat ENV PORT di Dockerfile.frontend — image
      # nginx-unprivileged tidak bisa bind port <1024 sebagai non-root).
      - "5173:8080"

volumes:
  imms_pg_data:
  imms_uploads:
