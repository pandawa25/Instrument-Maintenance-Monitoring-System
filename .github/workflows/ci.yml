name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # apps/backend depends on @imms/shared-utils (workspace package, dist/
      # tidak di-commit ke git — lihat .gitignore) — install & build ketiganya
      # bareng, urutan sama persis dengan docker/Dockerfile.backend yang sudah
      # terbukti jalan di Railway. Tanpa ini, tsc gagal resolve
      # '@imms/shared-utils' karena dist/-nya belum ada di checkout bersih.
      - run: npm install --workspace=apps/backend --workspace=packages/shared-utils --workspace=packages/shared-types
      - run: npm run build --workspace=packages/shared-utils
      - run: npm run prisma:generate --workspace=apps/backend
      - run: npm run build --workspace=apps/backend
      - run: npm test --workspace=apps/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --workspace=apps/frontend
      - run: npm test --workspace=apps/frontend
      - run: npm run build --workspace=apps/frontend
